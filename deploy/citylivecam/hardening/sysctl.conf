# Host tuning for the h3 stand: /etc/sysctl.d/99-ratatosk.conf

# QUIC (quinn in ratatosk-server, quic-go in Caddy). The 1 GiB default of
# 212992 bytes makes the packets of every handshake queue and drop; both
# implementations want ~7.5 MB to keep a socket draining under load.
net.core.rmem_max = 8388608
net.core.wmem_max = 8388608

# Handshake bursts reach the host through the NIC queue first, then the
# accept backlog. Defaults (1000 / 128) are sized for a quiet host.
net.core.netdev_max_backlog = 5000
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 1024

# Docker publishes 443/udp through conntrack: one entry per peer address.
# The 1 GiB default (7168) fills during a flood, and from then on every
# packet — including the legitimate ones — is dropped before it is seen.
net.netfilter.nf_conntrack_max = 32768

# Swap is a safety net against an OOM kill on a 1 GiB box, not a working set.
vm.swappiness = 10
