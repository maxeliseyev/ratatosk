[Definition]

# Caddy access log in JSON (see ../Caddyfile): `remote_ip` sits inside
# `request`, `status` follows it. Only client errors are counted: a scanner
# walking /.env, /admin and friends collects dozens in minutes, a human or a
# crawl gets a handful.
#
# The line starts with `{`, which cannot be written literally: fail2ban reads
# `{...}` in a regex as its own tags, so the start is left to `.*`.
failregex = ^.*"logger":"http\.log\.access\.[^"]*","msg":"handled request",.*"remote_ip":"<HOST>".*"status":(?:400|401|403|404|405|408|429)[,}].*$

# Caddy's "ts" is a Unix timestamp with a fraction: {EPOCH} reads it.
datepattern = ^\{"level":"[^"]*","ts":{EPOCH}
